version: '3.9'
services:
  app:
    build: .
    container_name: ai-lab-app
    ports:
    - 8088:8088
    environment:
    - OLLAMA_URL=http://ollama:11434
    - OLLAMA_MODEL=llama3.2
    - QDRANT_URL=http://qdrant:6333
    extra_hosts:
    - host.docker.internal:host-gateway
    volumes:
    - .:/app
    restart: unless-stopped
    networks:
    - shared-net
networks:
  shared-net:
    external: true
